[package]
name = "tug-agent"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Tug contributors"]
description = "Stateless BitTorrent/DHT/TCP/uTP local agent for Tug browser extension"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
getrandom = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "io-util", "io-std", "net", "fs", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
librqbit = "9.0.1"
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com"] }

[target.'cfg(unix)'.dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
