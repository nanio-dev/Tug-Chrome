name: Agent platforms
on:
  workflow_dispatch:
  push:
    paths: ['agent/**', 'scripts/package-agent-unix.mjs', 'tests/agent-*.test.mjs', '.github/workflows/agent-platforms.yml']
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux, arch: x64, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-musl}
          - {os: macos-15-intel, platform: macos, arch: x64, target: x86_64-apple-darwin}
          - {os: macos-15, platform: macos, arch: arm64, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with: {components: clippy, targets: '${{ matrix.target }}'}
      - if: matrix.platform == 'linux'
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld' >> "$GITHUB_ENV"
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
      - if: matrix.platform == 'linux'
        name: Verify static target startup before building dependencies
        run: |
          printf 'fn main() { println!("musl target startup OK"); }' > /tmp/tug-target-check.rs
          rustc --target ${{ matrix.target }} -C linker=rust-lld -C link-self-contained=yes /tmp/tug-target-check.rs -o /tmp/tug-target-check
          /tmp/tug-target-check
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: 'agent', key: '${{ matrix.target }}', cache-on-failure: true}
      - run: cargo clippy --manifest-path agent/Cargo.toml --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/Cargo.toml --locked --target ${{ matrix.target }}
      - run: cargo build --manifest-path agent/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Native handshake, export, lifecycle and user installation
        env: {TUG_TEST_AGENT: '${{ github.workspace }}/agent/target/${{ matrix.target }}/release/tug-agent'}
        run: node --test tests/agent-*.test.mjs
      - if: matrix.platform == 'linux'
        run: node scripts/package-agent-unix.mjs linux ${{ matrix.arch }} agent/target/${{ matrix.target }}/release/tug-agent out
      - run: |
          mkdir -p artifact
          cp agent/target/${{ matrix.target }}/release/tug-agent artifact/tug-agent
          if [ -d out ]; then cp out/*.tar.gz artifact/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifact/
          retention-days: 14
  macos-universal:
    needs: unix
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: agent-macos-x64, path: build/x64}
      - uses: actions/download-artifact@v4
        with: {name: agent-macos-arm64, path: build/arm64}
      - run: |
          lipo -create build/x64/tug-agent build/arm64/tug-agent -output build/tug-agent
          chmod +x build/tug-agent
          lipo build/tug-agent -verify_arch x86_64 arm64
          node scripts/package-agent-unix.mjs macos universal build/tug-agent out
          ditto -x -k out/tug-agent-macos-universal.zip build/unpacked
          codesign --verify --strict "build/unpacked/Tug Agent.app"
          TUG_TEST_AGENT="$PWD/build/unpacked/Tug Agent.app/Contents/MacOS/tug-agent" node --test tests/agent-*.test.mjs
      - uses: actions/upload-artifact@v4
        with: {name: agent-macos-universal, path: 'out/tug-agent-macos-universal.zip', retention-days: 14}
